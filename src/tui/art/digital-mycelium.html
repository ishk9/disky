<!DOCTYPE html>
<!--
    Digital Mycelium — Generative Art Viewer
    An algorithmic philosophy expressing how files spread through
    a filesystem like fungal networks colonize soil.
    Built from templates/viewer.html with the Anthropic branding preserved.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Mycelium — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button { margin-bottom: 0; }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active { transform: translateY(0); }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row {
            display: flex;
            gap: 8px;
        }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 40px;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Digital Mycelium</h1>
            <div class="subtitle">Files spread like fungal networks — branching filaments trace the hidden topology of disk consumption through noise-driven flow fields.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <!-- Parameters Section (VARIABLE) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Filament Count</label>
                    <div class="slider-container">
                        <input type="range" id="filamentCount" min="20" max="300" step="10" value="120" oninput="updateParam('filamentCount', this.value)">
                        <span class="value-display" id="filamentCount-value">120</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.002" max="0.02" step="0.001" value="0.006" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.006</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Growth Steps</label>
                    <div class="slider-container">
                        <input type="range" id="growthSteps" min="50" max="500" step="25" value="200" oninput="updateParam('growthSteps', this.value)">
                        <span class="value-display" id="growthSteps-value">200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Probability</label>
                    <div class="slider-container">
                        <input type="range" id="branchProb" min="0" max="0.05" step="0.002" value="0.015" oninput="updateParam('branchProb', this.value)">
                        <span class="value-display" id="branchProb-value">0.015</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Filament Weight</label>
                    <div class="slider-container">
                        <input type="range" id="strokeWeight" min="0.3" max="3.0" step="0.1" value="1.0" oninput="updateParam('strokeWeight', this.value)">
                        <span class="value-display" id="strokeWeight-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Decay Rate</label>
                    <div class="slider-container">
                        <input type="range" id="decayRate" min="0.9" max="1.0" step="0.005" value="0.97" oninput="updateParam('decayRate', this.value)">
                        <span class="value-display" id="decayRate-value">0.97</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Dependencies (node_modules)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#4a9e6b" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#4a9e6b</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Build Artifacts (.next, dist)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Caches (Gradle, Maven)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#d4a843" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#d4a843</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>IDE/Docker</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#c75d5d" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#c75d5d</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Background</label>
                    <div class="color-picker-container">
                        <input type="color" id="bgColor" value="#0a0a0f" onchange="updateColor('bgColor', this.value)">
                        <span class="color-value" id="bgColor-value">#0a0a0f</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom: 8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Growing mycelium network...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // PARAMETERS
        // ═══════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            filamentCount: 120,
            noiseScale: 0.006,
            growthSteps: 200,
            branchProb: 0.015,
            strokeWeight: 1.0,
            decayRate: 0.97,
            colorPalette: ['#4a9e6b', '#6a9bcc', '#d4a843', '#c75d5d'],
            bgColor: '#0a0a0f'
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═══════════════════════════════════════════════════════════════
        // DIGITAL MYCELIUM ALGORITHM
        // ═══════════════════════════════════════════════════════════════

        let filaments = [];
        let densityField;
        let fieldRes = 4;
        let growing = false;
        let growFrame = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            pixelDensity(1);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            let bg = hexToRgb(params.bgColor);
            background(bg.r, bg.g, bg.b);

            // Initialize density field for accumulation tracking
            let cols = Math.ceil(width / fieldRes);
            let rows = Math.ceil(height / fieldRes);
            densityField = Array.from({ length: rows }, () => new Float32Array(cols));

            filaments = [];
            growFrame = 0;

            // Create seed points — clustered like disk artifacts
            let seedPoints = [];
            let clusterCount = 3 + Math.floor(random(4));
            for (let c = 0; c < clusterCount; c++) {
                let cx = random(width * 0.15, width * 0.85);
                let cy = random(height * 0.15, height * 0.85);
                let count = Math.floor(params.filamentCount / clusterCount);

                for (let i = 0; i < count; i++) {
                    seedPoints.push({
                        x: cx + randomGaussian(0, width * 0.08),
                        y: cy + randomGaussian(0, height * 0.08),
                        category: c % params.colorPalette.length
                    });
                }
            }

            // Spawn filaments from seed points
            for (let sp of seedPoints) {
                filaments.push(new Filament(
                    sp.x, sp.y,
                    params.colorPalette[sp.category],
                    params.growthSteps,
                    sp.category
                ));
            }

            growing = true;
        }

        function draw() {
            if (!growing) return;

            let allDone = true;
            let stepsPerFrame = 4;

            for (let step = 0; step < stepsPerFrame; step++) {
                for (let f of filaments) {
                    if (!f.done) {
                        f.grow();
                        allDone = false;
                    }
                }
                growFrame++;
            }

            if (allDone) {
                growing = false;
                noLoop();
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // FILAMENT CLASS
        // ═══════════════════════════════════════════════════════════════

        class Filament {
            constructor(x, y, col, maxSteps, category) {
                this.x = x;
                this.y = y;
                this.col = hexToRgb(col);
                this.maxSteps = maxSteps;
                this.step = 0;
                this.done = false;
                this.category = category;
                this.prevX = x;
                this.prevY = y;
                this.alpha = 180;
                this.weight = params.strokeWeight;
                // Slight angular bias per filament for variety
                this.angleBias = random(-0.3, 0.3);
            }

            grow() {
                if (this.done) return;

                let nx = this.x * params.noiseScale;
                let ny = this.y * params.noiseScale;

                // Multi-octave noise for direction
                let angle = noise(nx, ny, this.category * 10) * TAU * 2 + this.angleBias;

                // Secondary noise for turbulence
                let turbulence = noise(nx * 3 + 500, ny * 3 + 500) * 0.5;
                angle += turbulence;

                // Step along the flow
                let stepSize = 1.2 + noise(nx * 2, ny * 2) * 0.8;
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += cos(angle) * stepSize;
                this.y += sin(angle) * stepSize;

                // Accumulate density
                let gx = Math.floor(this.x / fieldRes);
                let gy = Math.floor(this.y / fieldRes);
                if (gy >= 0 && gy < densityField.length && gx >= 0 && gx < densityField[0].length) {
                    densityField[gy][gx] = Math.min(1, densityField[gy][gx] + 0.02);
                }

                // Draw the filament segment
                let lifeRatio = this.step / this.maxSteps;
                let fadeAlpha = this.alpha * (1 - lifeRatio * 0.6) * params.decayRate;

                // At convergence points (high density), brighten
                let densityBoost = 1;
                if (gy >= 0 && gy < densityField.length && gx >= 0 && gx < densityField[0].length) {
                    densityBoost = 1 + densityField[gy][gx] * 2;
                }

                let w = this.weight * (1 - lifeRatio * 0.5) * densityBoost;

                stroke(this.col.r, this.col.g, this.col.b, fadeAlpha);
                strokeWeight(w);
                line(this.prevX, this.prevY, this.x, this.y);

                // Glow effect at high density
                if (densityBoost > 1.5) {
                    stroke(this.col.r, this.col.g, this.col.b, fadeAlpha * 0.2);
                    strokeWeight(w * 3);
                    line(this.prevX, this.prevY, this.x, this.y);
                }

                this.step++;

                // Branching
                if (random() < params.branchProb && this.step > 10 && this.step < this.maxSteps * 0.7) {
                    let child = new Filament(
                        this.x, this.y,
                        rgbToHex(this.col),
                        Math.floor((this.maxSteps - this.step) * 0.6),
                        this.category
                    );
                    child.angleBias = this.angleBias + random(-0.8, 0.8);
                    child.alpha = fadeAlpha * 0.7;
                    child.weight = w * 0.7;
                    filaments.push(child);
                }

                // Termination conditions
                if (this.step >= this.maxSteps) this.done = true;
                if (this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20) this.done = true;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // UTILITY FUNCTIONS
        // ═══════════════════════════════════════════════════════════════

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(rgb) {
            return '#' + [rgb.r, rgb.g, rgb.b]
                .map(v => v.toString(16).padStart(2, '0'))
                .join('');
        }

        // ═══════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═══════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            loop();
            initializeSystem();
        }

        function updateColor(colorId, value) {
            document.getElementById(colorId + '-value').textContent = value;
            if (colorId === 'bgColor') {
                params.bgColor = value;
            } else {
                let idx = parseInt(colorId.replace('color', '')) - 1;
                params.colorPalette[idx] = value;
            }
            loop();
            initializeSystem();
        }

        // ═══════════════════════════════════════════════════════════════
        // SEED CONTROLS (FIXED)
        // ═══════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                loop();
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            document.getElementById('filamentCount').value = params.filamentCount;
            document.getElementById('filamentCount-value').textContent = params.filamentCount;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('growthSteps').value = params.growthSteps;
            document.getElementById('growthSteps-value').textContent = params.growthSteps;
            document.getElementById('branchProb').value = params.branchProb;
            document.getElementById('branchProb-value').textContent = params.branchProb;
            document.getElementById('strokeWeight').value = params.strokeWeight;
            document.getElementById('strokeWeight-value').textContent = params.strokeWeight;
            document.getElementById('decayRate').value = params.decayRate;
            document.getElementById('decayRate-value').textContent = params.decayRate;

            params.colorPalette.forEach((c, i) => {
                document.getElementById('color' + (i + 1)).value = c;
                document.getElementById('color' + (i + 1) + '-value').textContent = c;
            });
            document.getElementById('bgColor').value = params.bgColor;
            document.getElementById('bgColor-value').textContent = params.bgColor;

            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('digital-mycelium-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
